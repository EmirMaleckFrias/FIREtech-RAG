<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%233D1974%22/><text x=%2216%22 y=%2223.5%22 text-anchor=%22middle%22 font-family=%22Arial,Helvetica,sans-serif%22 font-size=%2221%22 font-weight=%22bold%22 fill=%22%23FFFFFF%22>A</text></svg>"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- color de la UI del navegador acorde al fondo de la app. Sin media
         query: lo actualiza src/lib/theme.ts, porque el tema ya no lo decide
         solo el sistema (Ajustes -> Mi cuenta -> Apariencia). -->
    <meta name="theme-color" content="#FAFAF9" />
    <!-- Tema ANTES de pintar. Los tokens de styles.css cuelgan de
         [data-theme], asi que sin esto quien tiene oscuro veria un fogonazo
         blanco en cada carga. Duplica a proposito la logica de
         src/lib/theme.ts (aplicarTema): es la unica forma de que corra antes
         del bundle. Si cambia una, cambia la otra. -->
    <script>
      (function () {
        var tema = 'sistema';
        try {
          var g = localStorage.getItem('rag-tema');
          if (g === 'claro' || g === 'oscuro' || g === 'sistema') tema = g;
        } catch (e) {
          /* navegacion privada: se queda en 'sistema' */
        }
        var oscuro =
          tema === 'oscuro' ||
          (tema === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = oscuro ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', oscuro ? '#101010' : '#FAFAF9');
      })();
    </script>
    <!-- PWA instalable -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alzheimer Project" />
    <title>Alzheimer Project · AI ROBOTIX</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
